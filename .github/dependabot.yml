version: 2
updates:
  # Python deps: Dependabot's `uv` ecosystem understands pyproject.toml (PEP 621)
  # + uv.lock together, including the [dependency-groups].dev pins that used to
  # live as inline `uvx X==Y` strings in ci.yml, and keeps them in sync in one PR.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "deps(uv)"

  # GitHub Actions (actions/checkout, astral-sh/setup-uv, etc.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "ci"

