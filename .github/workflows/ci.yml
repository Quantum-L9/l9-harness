name: ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {enable-cache: true}
      # Dev tool versions (ruff/mypy/pytest/jsonschema) now come from the
      # [dependency-groups].dev pins in pyproject.toml via uv.lock, not inline
      # `uvx X==Y` strings — this is what lets Dependabot's uv ecosystem track
      # and auto-bump them.
      - run: uv sync --locked --group dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src/l9_harness
      - run: uv run pytest
      - run: uv run python scripts/verify_generated.py
      # mypy/pytest leave __pycache__/.mypy_cache/.pytest_cache behind; V-QUALITY-002
      # in validate_repository.py treats any such residue in the source tree as a
      # failure, so it must run against a clean checkout.
      - run: find . -name '__pycache__' -not -path './.venv/*' -exec rm -rf {} + ; rm -rf .pytest_cache .mypy_cache .ruff_cache
      - run: uv run python scripts/validate_repository.py
