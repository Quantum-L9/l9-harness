name: ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with: {enable-cache: true}
      # Dev tool versions (ruff/mypy/pytest/jsonschema) now come from the
      # [dependency-groups].dev pins in pyproject.toml via uv.lock, not inline
      # `uvx X==Y` strings — this is what lets Dependabot's uv ecosystem track
      # and auto-bump them.
      - run: uv sync --locked --group dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src/l9_harness
      # The organization's required workflow judges pull-request test
      # expense: a full-suite selection is refused on a judged event. The
      # fast lane runs the contract and architecture suites; conformance,
      # adversarial and integration run in conformance.yml and in the
      # admitted deep entry point, which is dispatched nightly.
      - run: uv run pytest tests/contract tests/architecture
      - run: uv run python scripts/verify_generated.py
      # mypy/pytest leave __pycache__/.mypy_cache/.pytest_cache behind; V-QUALITY-002
      # in validate_repository.py treats any such residue in the source tree as a
      # failure, so it must run against a clean checkout.
      - run: find . -name '__pycache__' -not -path './.venv/*' -exec rm -rf {} + ; rm -rf .pytest_cache .mypy_cache .ruff_cache
      - run: uv run python scripts/validate_repository.py
