  transport_packet_inter_node_wire_rule: not_applicable_to_filesystem_assurance_exchange
  gate_only_node_egress: not_applicable
  derive_or_with_hop: not_applicable
  packet_envelope: prohibited
  transport_packet_repository_check: preserved_as_sdk_observation
  metadata_coverage: repository_meta_plus_per_file_index
external_blockers:
  - immutable_assurance_release_tuple
  - published_assurance_plan_schema_and_vectors
  - trusted_sdk_release_tuple
  - authority_canonicalization_fixture_set
  - ci_core_shadow_parity_evidence
