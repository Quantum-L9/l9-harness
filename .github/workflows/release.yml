name: release-build
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run --with pytest==9.0.2 --with jsonschema==4.26.0 python scripts/build_release.py
      - uses: actions/upload-artifact@v7
        with: {name: l9-harness-release-candidate, path: dist/}
