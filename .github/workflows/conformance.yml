name: conformance
on: [workflow_dispatch, pull_request]
permissions: {contents: read}
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run --with pytest==9.0.2 --with jsonschema==4.26.0 pytest tests/conformance tests/replay tests/adversarial
