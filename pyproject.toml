[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "l9-harness"
version = "2.0.4"
description = "Deterministic local execution, conformance, replay, and shadow tooling for the Quantum-L9 CI constellation."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Quantum-L9" }]
dependencies = []

[project.scripts]
l9-harness = "l9_harness.cli.app:main"

# Exact-pinned (not ranged) to match this repo's CI philosophy: ci.yml previously
# pinned these same versions inline via `uvx ruff==X` / `uv run --with X==Y`, which
# Dependabot's `uv` ecosystem cannot see or bump. Declaring them here puts them in
# uv.lock so Dependabot tracks and bumps them like any other dependency.
[dependency-groups]
dev = [
  "ruff==0.12.12",
  "mypy==1.17.1",
  "pytest==9.0.2",
  "jsonschema==4.26.0",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["l9_harness"]
warn_unused_configs = true
exclude = ["tests"]
